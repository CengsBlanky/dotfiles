# curl -sSL https://raw.githubusercontent.com/alacritty/alacritty/master/extra/alacritty.info | tic -x -
[env]
TERM="xterm-256color"

[bell]
duration = 0

[colors]
transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#212529"
foreground = "#d8dee9"

[font]
builtin_box_drawing = true
# normal.family = "Cousine Nerd Font"
# normal.family = "CaskaydiaMono Nerd Font"
# normal.style = "SemiLight"
# normal.family = "Hasklug Nerd Font"
# normal.family = "MapleMono"
# normal.family = "MesloLGS Nerd Font"
# normal.family = "HackZeroSlash Nerd Font"
# normal.family = "DejaVuSansM Nerd Font"
# normal.family = "JetBrainsMono NL Nerd Font"
# normal.family = "IosevkaTerm Nerd Font"
# normal.family = "MapleMono"
# normal.family = "IMWritingMono Nerd Font"
# normal.family = "RobotoMono Nerd Font"
# normal.family = "UbuntuSansMono Nerd Font"
normal.family = "SauceCodePro Nerd Font"
normal.style = "medium"
size = 14

[[keyboard.bindings]]
action = "ScrollLineUp"
mods = "Control|Shift"
key = "K"

[[keyboard.bindings]]
action = "ScrollLineDown"
mods = "Control|Shift"
key = "J"

[[keyboard.bindings]]
action = "Paste"
mods = "Shift"
key = "Insert"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
# use key binding or shift+leftMouse to open url
binding = { key = "`", mods = "Control" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[mouse]
hide_when_typing = true

[terminal.shell]
program = "/usr/bin/tmux"

[window]
decorations = "None"
dynamic_title = false
opacity = 1
startup_mode = "Maximized"
dynamic_padding = true

[scrolling]
history = 100000
