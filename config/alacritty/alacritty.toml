# curl -sSL https://raw.githubusercontent.com/alacritty/alacritty/master/extra/alacritty.info | tic -x -
[env]
# for underdotted and undercurl
TERM="alacritty"

[bell]
duration = 0

[colors]
transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#212529"
foreground = "#d8dee9"

[font]
builtin_box_drawing = true
normal.family = "IosevkaZeng"
normal.style = "semi-light"
size = 13

[[keyboard.bindings]]
action = "ScrollLineUp"
mods = "Control|Shift"
key = "K"

[[keyboard.bindings]]
action = "ScrollLineDown"
mods = "Control|Shift"
key = "J"

[[keyboard.bindings]]
action = "Paste"
mods = "Shift"
key = "Insert"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
# use key binding or shift+leftMouse to open url
binding = { key = "`", mods = "Control" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[mouse]
hide_when_typing = true

[terminal.shell]
program = "/usr/local/bin/tmux"

[window]
decorations = "None"
dynamic_title = false
opacity = 0.9
startup_mode = "Maximized"
dynamic_padding = true

[scrolling]
history = 100000
