# curl -sSL https://raw.githubusercontent.com/alacritty/alacritty/master/extra/alacritty.info | tic -x -
[env]
# for underdotted and undercurl
TERM="alacritty"

[bell]
duration = 0

[colors]
transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1c1b1e"
foreground = "#d8dee9"

[font]
builtin_box_drawing = true
# normal.family = "IosevkaZeng"
# normal.style = "Light"
# size = 13
# CaskaydiaMono
# normal.family = "CaskaydiaMono"
# normal.style = "SemiLight"
# bold.style = "SemiBold"
# size = 11
# CaskaydiaMono PingFang
# normal.family = "CaskaydiaPingFang"
# normal.style = "Light"
# bold.style = "SemiBold"
# UbuntuSansMono
# normal.family = "UbuntuSansMono"
# size = 12
# UbuntuSans PingFang
# normal.family = "UbuntuSansPingFang"
# normal.style = "Light"
# size = 12
# jetbrains
# normal.family = "JetBrains"
# normal.style = "Light"
# size = 11
# Consolas
# normal.family = "ConsolasApple"
# normal.style = "Light"
# normal.family = "ConsolasNF"
# size = 12
normal.family = "SauceCodePro"
size = 11.5
# normal.family = "ComicMono"
# size = 11.5
# normal.family = "LilexPingFang"
# size = 11

# [font.offset]
# y = 0

[[keyboard.bindings]]
action = "Paste"
mods = "Shift"
key = "Insert"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
# use key binding or shift+leftMouse to open url
binding = { key = "`", mods = "Control" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"

[mouse]
hide_when_typing = true

[terminal.shell]
program = "tmux"

[window]
decorations = "None"
dynamic_title = false
opacity = 1
startup_mode = "Maximized"
dynamic_padding = true

[scrolling]
history = 100000
