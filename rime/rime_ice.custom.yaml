patch:
  global_ascii: false                        # 切换为 ascii 模式时，是否影响所有窗口：true；false
  style:
    color_scheme: zeng

    font_face: "Noto Sans SC,Maple Mono Normal NL NF CN, Microsoft YaHei"
    font_point: 14
    horizontal: true
    inline_preedit: true
    label_font_point: 14
    layout:
      border: 2
      margin_x: 10
      margin_y: 10
      hilite_padding: 5
      hilite_spacing: 5
      spacing: 5
      candidate_spacing: 20
      corner_radius: 10                       # 候选窗口圆角半径
      round_corner: 10                        # 候选背景色块圆角半径，又名 hilited_corner_radius

  preset_color_schemes:
    zeng:
      name: windark
      author: zeng
      back_color: '0x251e1f'
      border_color: '0x251e1f'
      text_color: '0xbfbfb3'
      hilited_text_color: '0x686868'
      hilited_back_color: '0x6a564c'
      hilited_comment_text_color: '0x8f8686'
      hilited_candidate_text_color: '0xe6e7e9'
      hilited_candidate_back_color: '0x6a564c'
      hilited_label_color: '0x8f8686'
      candidate_text_color: '0xa9a9a9'
      comment_text_color: '0x8e8686'
      label_color: '0x8f8888'
