# default interval is 15 seconds
# set -g status-interval 60
set -g default-terminal "alacritty"
set -ag terminal-overrides ',alacritty:Tc'
set-option -a terminal-features 'alacritty:RGB'
# Activity and Events
set -g monitor-activity on
set -g visual-activity off
set-option -g focus-events on
set -gq allow-passthrough on
set -g xterm-keys on
set-option -g history-limit 100000
set-option -sg escape-time 10
set-option -g default-shell /usr/bin/fish
# setting the prefix from C-b to C-a
set -g prefix C-q
# unset default prefix key
unbind C-b
# use key binding to reload configuaration file
bind r source-file ~/.tmux.conf \; display "Reloaded!"
# splitting panes with | and -
bind -n M-= split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
# maybe show/hide command line pane??
bind - split-window -v -c "#{pane_current_path}" -l 20%
# enable mouse on globally
set -g mouse on
# set vi as default editor
set -g status-keys vi
# toggle synchronize-panes
unbind C-s
bind C-y set-window-option synchronize-panes
# navigating panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-\\ select-pane -l
# close pane and window
bind -n M-C-w kill-pane
bind -n M-C-k kill-window

# resize current pane
bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3
bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3

# unbind default select-pane keybinds
unbind-key -T root C-h
unbind-key -T root C-j
unbind-key -T root C-k
unbind-key -T root C-l

# start window and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind-key -n C-M-t new-window
bind-key -T prefix k kill-window
bind-key -T prefix x kill-pane
unbind-key -T root Escape
unbind-key -T root WheelUpStatus
unbind-key -T copy-mode-vi PageUp
unbind-key -T copy-mode-vi PageDown

# use vim as copy mode editor
setw -g mode-keys vi
# use system clipboard instead
unbind -T copy-mode-vi Space;
unbind -T copy-mode-vi Enter;
bind -T copy-mode-vi v send-keys -X begin-selection
# use <C-v> after enter copy mode to switch to rectangle copy mode(resolve vim line number leading chars)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection -rmlastnl clipboard"
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi C-j send-keys -X page-down
bind -T copy-mode-vi C-k send-keys -X page-up
bind -T copy-mode-vi Y send-keys -X copy-line-and-cancel

# default statusbar colors
set -g status-position bottom
set -g status-justify absolute-centre
# set -g mode-style 'bg=#a3be8c,fg=gray,noreverse'
set-window-option -g mode-style "bg=#ced4da,fg=#4c566a,reverse"
set-option -g status-style fg=colour249,bg=#262626
#[fg=#e9ecef]#[bold]#(fish -c tmux_weather)
set-option -g status-right '#(gitmux -cfg .gitmux.conf "#{pane_current_path}")'
set-option -g status-left-style fg=colour220
set-option -g status-left-length 128
set-option -g status-left "#[fg=#5f6f86,bold]#(tmux display-message -p '#{pane_current_path}' | sed 's#$HOME#~#g')#[align=absolute-centre]#[fg=colour220]󰇥 #[fg=#5981a2]"
# set-option -g status-left "#[align=absolute-centre]󰇥 "
# active window title colors
set-window-option -g window-status-current-style fg=colour15,bg=default,bright
# pane border
set -g pane-border-style "fg=#868e96"
set -g pane-active-border-style "fg=#8fbcbb,bg=default,bold"
set -g display-panes-time 100000  # 100 seconds
set -g pane-border-status off
# set -g pane-border-format " #{pane_current_command}  #{pane_current_path} "
set -g pane-border-indicators both
set -g window-status-activity-style fg=#88a8af,bg=default

# tmux plugins
set -g @plugin 'tmux-plugins/tmux-open'
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
